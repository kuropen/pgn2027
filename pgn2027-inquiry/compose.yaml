name: kuropen-inquiry

x-app: &app
  image: kuropen-inquiry:local
  build: .
  env_file: .env
  environment:
    DB_CONNECTION: sqlite
    DB_DATABASE: /app/database/data/database.sqlite
    OCTANE_SERVER: frankenphp
  volumes:
    - inquiry-database:/app/database/data
    - inquiry-storage:/app/storage

services:
  init:
    <<: *app
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'test -f /app/database/data/database.sqlite || touch /app/database/data/database.sqlite; php artisan migrate --force --no-interaction'
    restart: "no"

  web:
    <<: *app
    ports:
      - "127.0.0.1:${INQUIRY_PORT:-8000}:8000"
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  queue:
    <<: *app
    command: ["queue:work", "inquiry", "--sleep=1", "--tries=5", "--timeout=60"]
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 70s

  scheduler:
    <<: *app
    command: ["schedule:work"]
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  inquiry-database:
  inquiry-storage:
